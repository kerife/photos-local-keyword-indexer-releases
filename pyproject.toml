[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photos-local-keyword-indexer"
version = "0.1.1"
description = "Indexador local de keywords para Apple Fotos mediante Ollama"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "photoscript==0.5.3",
    "pyobjc-framework-Photos==12.2.2",
    "pyobjc-framework-MapKit==12.2.2",
    "pyobjc-framework-CoreLocation==12.2.2",
    "pyobjc-framework-Quartz==12.2.2",
    "httpx>=0.27.0,<1",
    "pydantic>=2.8,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
]
build = [
    "pyinstaller>=6.10,<7",
]

[project.scripts]
photos-indexer = "photos_indexer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = false
source = [
    "photos_indexer.taxonomy",
    "photos_indexer.models",
    "photos_indexer.manifest",
    "photos_indexer.workflows",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["app/.build", ".venv", ".venv311", ".venv312"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
